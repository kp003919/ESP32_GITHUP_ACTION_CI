name: 🔌 ESP32 HIL Tests (Cure IoT project)
on:
  push:
    branches:
      - main
      - freertos-tasks    # ← ADD THIS LINE
  workflow_dispatch:      # Allows manual run from GitHub UI

jobs:
  hil_test:              # ← Make sure this matches your job name!
    name: Build → Flash → Test
    runs-on:
      - self-hosted
      - esp32
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Install dependencies
        run: pip install platformio pyserial

      - name: 🔨 Build firmware
        run: pio run

      - name: ⚡ Flash to ESP32
        run: pio run -t upload

      - name: 🧪 Run HIL serial tests
        run: python scripts/hil_test_runner.py
        env:
          SERIAL_PORT: COM7       # ← YOUR port number here
          SERIAL_BAUD: 115200