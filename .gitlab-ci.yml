variables:
  GIT_STRATEGY: clone

stages:
  - build
  - test

# ==============================================
# STAGE 1: Build Firmware (GitLab Cloud)
# ==============================================
build_firmware:
  stage: build
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install platformio
  script:
    - echo "=== Building ESP32 Firmware ==="
    - pio run
    - echo "=== Build Complete ==="
  artifacts:
    paths:
      - .pio/build/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pio/

# ==============================================
# STAGE 2: Software Tests (GitLab Cloud)
# ==============================================
ci_tests:
  stage: test
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "=== Running Software Tests ==="
    - ls -R .
    - pytest -m "not hil" -v --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week

# ==============================================
# STAGE 3: HIL Hardware Tests (Your Laptop)
# ==============================================
hil_tests:
  stage: test
  tags:
    - esp32
  dependencies:
    - build_firmware
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install platformio pyserial
  script:
    - echo "=== HIL: Flashing Firmware ==="
    - pio run -t upload
    - echo "=== HIL: Running Serial Test Suite ==="
    - python3 scripts/hil_test_runner.py
    - echo "=== HIL: Running Pytest HIL ==="
    - pytest -m hil -v --junitxml=hil_report.xml
  artifacts:
    reports:
      junit: hil_report.xml
    paths:
      - hil_report.xml
    expire_in: 1 week
  timeout: 15 minutes